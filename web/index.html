<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경건생활 — 청소년부·학부모</title>
<meta name="description" content="매일의 날주와 기도를 기록하고 돌아보는 앱">
<meta name="theme-color" content="#0066FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- 로그인 -->
  <section id="screen-login" class="cover">
    <div class="cover-body">
      <div class="cover-hero">
        <div class="cover-brand-text">경건생활</div>
        <h1 class="cover-title">매일의 말씀과 기도를<br>기록하고 돌아봅니다</h1>
        <p class="cover-sub">청소년부 학생과 학부모를 위한 기록장</p>
      </div>
      <div class="cover-features">
        <div class="feat-row"><span class="feat-icon">📖</span>
          <div><div class="feat-title">날주 체크</div><div class="feat-sub">오늘의 맥체인 본문과 결단</div></div></div>
        <div class="feat-row"><span class="feat-icon">🗓️</span>
          <div><div class="feat-title">한 달 달력</div><div class="feat-sub">내 기록을 한눈에</div></div></div>
        <div class="feat-row"><span class="feat-icon">🙏</span>
          <div><div class="feat-title">기도 요청</div><div class="feat-sub">담임교사에게만 전해집니다</div></div></div>
        <div class="feat-row"><span class="feat-icon">📚</span>
          <div><div class="feat-title">신앙 자료</div><div class="feat-sub">신앙고백서·요리문답</div></div></div>
      </div>
      <div class="cover-cta-wrap">
        <div id="gis-button" class="cta-gis"></div>
        <p id="login-notice" class="login-notice"></p>
        <p class="cover-foot">구글 계정으로 로그인합니다. 기록은 본인과 담임교사만 볼 수 있습니다.</p>
      </div>
    </div>
  </section>

  <!-- 가입 -->
  <section id="screen-register" class="register" hidden>
    <div class="register-hero">
      <h1 class="cover-title">처음 오셨네요</h1>
      <p class="register-sub">담임교사에게 받은 등록 코드를 입력해 주세요.</p>
      <p class="register-account">로그인 계정: <b id="reg-account"></b></p>
    </div>

    <div class="form-row">
      <span class="form-label">저는</span>
      <div class="part-pills">
        <button type="button" class="seg-btn" id="reg-kind-student">학생이에요</button>
        <button type="button" class="seg-btn" id="reg-kind-parent">학부모예요</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label" for="reg-name">이름 (필수)</label>
      <input class="form-input" id="reg-name" maxlength="30" autocomplete="name" placeholder="예: 김믿음">
    </div>

    <div class="form-row">
      <label class="form-label" for="reg-extra" id="reg-extra-label">학년·반 (선택)</label>
      <input class="form-input" id="reg-extra" maxlength="30" placeholder="예: 중2-1">
    </div>

    <div class="form-row">
      <label class="form-label" for="reg-code">등록 코드 (필수)</label>
      <input class="form-input" id="reg-code" maxlength="60" autocomplete="off" placeholder="담임교사에게 받은 코드">
    </div>

    <p id="reg-error" class="register-error" role="alert"></p>
    <button class="btn primary block" id="reg-submit">등록하고 시작하기</button>
    <button class="btn ghost block" id="reg-cancel">다른 계정으로 로그인</button>
  </section>

  <!-- 본 화면 -->
  <section id="screen-app" hidden>
    <header class="appbar">
      <div class="appbar-inner">
        <div>
          <div class="appbar-title" id="app-name"></div>
          <div class="sheet-sub" id="app-kind"></div>
        </div>
        <button class="btn sm ghost" id="btn-signout">로그아웃</button>
      </div>
    </header>

    <!-- ★ 메뉴는 반드시 본문(main)보다 «앞»에 온다.
         .topnav는 제목줄 바로 아래에 붙도록 만든 스타일인데, 예전에는 main 뒤에
         있어서 화면 맨 아래에 깔렸다. 그러면 탭이 보이지 않아 다른 화면으로
         갈 방법이 없다 (2026-07-30 실사용 신고). -->
    <nav id="nav" class="topnav"></nav>

    <main id="view" class="view"></main>
  </section>

</div>

<!-- 맥체인 성경읽기표는 UMD 모듈이라 일반 script로 먼저 올려 window.MccheynePlan을 만든다.
     (선행 저장소에서 검증된 파일을 내용 수정 없이 계승했다 — 계약 §6) -->
<script src="js/mccheyne-plan.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
