<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경건생활 — 청소년부·학부모</title>
<meta name="description" content="매일의 날주와 기도를 기록하고 돌아보는 앱">
<meta name="theme-color" content="#0066FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
// ★ 설치 이벤트를 «모듈보다 먼저» 잡아 둔다.
//    js/app.js는 type="module"이라 암묵적 defer다. 캐시된 재방문에서는
//    beforeinstallprompt가 모듈 평가 전에 발화해서, 그때 등록하면 놓친다
//    (안내가 «떴다 안 떴다» 하는 원인이 된다 — GIS에서 이미 겪은 함정과 같은 종류).
//    preventDefault를 해야 크롬 자체 배너 대신 우리 안내를 쓸 수 있다.
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  window.__bip = e;
});
</script>
</head>
<body>

<div class="app">

  <!-- 로그인 -->
  <section id="screen-login" class="cover">
    <div class="cover-body">
      <div class="cover-hero">
        <div class="cover-brand-text">경건생활</div>
        <h1 class="cover-title">매일의 말씀과 기도를<br>기록하고 돌아봅니다</h1>
      </div>

      <!-- ★ 카카오톡 등 «앱 안의 브라우저»에서 열었을 때만 보이는 안내.
           그 안에서는 구글 로그인 창을 다녀오는 사이 이 페이지가 통째로 다시 읽혀
           로그인 정보가 사라진다. 그래서 로그인이 «되지 않는 것»처럼 보인다
           (2026-07-31 실사용 신고의 실제 원인). app.js가 감지해서 표시한다. -->
      <div id="inapp-banner" class="inapp-banner" hidden>
        <p class="inapp-title">카카오톡 안에서는 로그인이 되지 않습니다</p>
        <p class="inapp-desc">아래 버튼으로 크롬·사파리에서 열어 주세요.</p>
        <div class="inapp-actions">
          <button type="button" id="inapp-open" class="btn primary">브라우저로 열기</button>
          <button type="button" id="inapp-copy" class="btn ghost">주소 복사</button>
        </div>
      </div>

      <!-- 앱으로 설치하기 안내 (2026-07-31 요청). 설치할 수 있는 환경에서만 뜬다.
           카카오톡 안에서는 설치가 불가능하므로 위의 «브라우저로 열기»만 보인다. -->
      <div id="install-banner" class="install-banner" hidden>
        <p class="install-title"></p>
        <p class="install-desc"></p>
        <button type="button" id="install-go" class="btn primary" hidden></button>
      </div>

      <div class="cover-features">
        <div class="feat-row"><span class="feat-icon">📖</span>
          <div><div class="feat-title">날주 체크</div><div class="feat-sub">오늘의 맥체인 본문과 결단</div></div></div>
        <div class="feat-row"><span class="feat-icon">🗓️</span>
          <div><div class="feat-title">한 달 달력</div><div class="feat-sub">내 기록을 한눈에</div></div></div>
        <div class="feat-row"><span class="feat-icon">🙏</span>
          <div><div class="feat-title">기도 요청</div><div class="feat-sub">담임교사에게만 전해집니다</div></div></div>
        <div class="feat-row"><span class="feat-icon">📚</span>
          <div><div class="feat-title">신앙 자료</div><div class="feat-sub">신앙고백서·요리문답</div></div></div>
      </div>
      <div class="cover-cta-wrap">
        <div id="gis-button" class="cta-gis"></div>
        <p id="login-notice" class="login-notice"></p>
        <p class="cover-foot">구글 계정으로 로그인합니다. 기록은 본인과 담임교사만 볼 수 있습니다.</p>
      </div>
    </div>
  </section>

  <!-- 가입 -->
  <section id="screen-register" class="register" hidden>
    <div class="register-hero">
      <h1 class="cover-title">처음 오셨네요</h1>
      <p class="register-sub">담임교사에게 받은 등록 코드를 입력해 주세요.</p>
      <p class="register-account">로그인 계정: <b id="reg-account"></b></p>
    </div>

    <div class="form-row">
      <span class="form-label">저는</span>
      <!-- 분류를 고르면 그 분류에 필요한 칸만 보인다 (2026-07-31 요청:
           "학부모 가입인데 학교 입력 이런 거 안 뜨게") -->
      <div class="kind-choices">
        <button type="button" class="kind-btn" id="reg-kind-student">
          <span class="kind-title">황규일교사반 학생</span>
          <span class="kind-desc">청소년부 학생</span>
        </button>
        <button type="button" class="kind-btn" id="reg-kind-parent">
          <span class="kind-title">황규일교사반 학부모</span>
          <span class="kind-desc">청소년부 학생의 학부모</span>
        </button>
        <button type="button" class="kind-btn" id="reg-kind-member">
          <span class="kind-title">혜림교회 성도</span>
          <span class="kind-desc">성인(만 14세 이상)만 선택해 주세요</span>
        </button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label" for="reg-name">이름 (필수)</label>
      <input class="form-input" id="reg-name" maxlength="30" autocomplete="name" placeholder="예: 김믿음">
    </div>

    <div class="form-row">
      <label class="form-label" for="reg-extra" id="reg-extra-label">학년·반 (선택)</label>
      <input class="form-input" id="reg-extra" maxlength="30" placeholder="예: 중2-1">
    </div>

    <!-- 학교는 학생에게만 보인다. 시트에만 저장하고 어떤 응답에도 넣지 않는다. -->
    <div class="form-row" id="reg-school-row">
      <label class="form-label" for="reg-school">학교 (선택)</label>
      <input class="form-input" id="reg-school" maxlength="30" placeholder="예: 혜림중학교">
    </div>

    <div class="form-row">
      <label class="form-label" for="reg-code">등록 코드 (필수)</label>
      <input class="form-input" id="reg-code" maxlength="60" autocomplete="off" placeholder="담임교사에게 받은 코드">
    </div>

    <p id="reg-error" class="register-error" role="alert"></p>
    <!-- 가입 화면에도 같은 안내를 둔다 — 요청 원문이 «가입고 로그인시»였다.
         내용은 로그인 화면과 같고, app.js가 두 자리를 함께 채운다. -->
    <div id="install-banner-reg" class="install-banner" hidden>
      <p class="install-title"></p>
      <p class="install-desc"></p>
      <button type="button" id="install-go-reg" class="btn primary" hidden></button>
    </div>
    <button class="btn primary block" id="reg-submit">등록하고 시작하기</button>
    <button class="btn ghost block" id="reg-cancel">다른 계정으로 로그인</button>
  </section>

  <!-- 본 화면 -->
  <section id="screen-app" hidden>
    <header class="appbar">
      <div class="appbar-inner">
        <!-- 앱 이름 = 홈으로 가는 문 (홈은 탭이 아니다 — 탭이 6개가 되면
             누르기 어려워지는 문제가 되살아난다) -->
        <button type="button" class="appbar-home" id="app-home" aria-label="홈으로">
          <span class="appbar-title" id="app-name"></span>
          <span class="sheet-sub" id="app-kind"></span>
        </button>
        <button class="btn sm ghost" id="btn-signout">로그아웃</button>
      </div>
    </header>

    <!-- ★ 메뉴는 반드시 본문(main)보다 «앞»에 온다.
         .topnav는 제목줄 바로 아래에 붙도록 만든 스타일인데, 예전에는 main 뒤에
         있어서 화면 맨 아래에 깔렸다. 그러면 탭이 보이지 않아 다른 화면으로
         갈 방법이 없다 (2026-07-30 실사용 신고). -->
    <nav id="nav" class="topnav"></nav>

    <main id="view" class="view"></main>
  </section>

</div>

<!-- 맥체인 성경읽기표는 UMD 모듈이라 일반 script로 먼저 올려 window.MccheynePlan을 만든다.
     (선행 저장소에서 검증된 파일을 내용 수정 없이 계승했다 — 계약 §6) -->
<script src="js/mccheyne-plan.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
